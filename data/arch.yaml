#YAML

Update:
    - sudo pacman -Syyu

Packages: 
    - sudo pacman -S --noconfirm sysfsutils
    - sudo pacman -S --noconfirm stow
    - sudo pacman -S --noconfirm solaar
    - sudo pacman -S --noconfirm deja-dup
    - sudo pacman -S --noconfirm rsync
    - sudo pacman -S --noconfirm rclone
    - sudo pacman -S --noconfirm yazi
    - sudo pacman -S --noconfirm stow
    - sudo pacman -S --noconfirm proton-vpn-gtk-gui
    - sudo pacman -S --noconfirm proton-vpn-cli
    - yay -S --noconfirm tether-bin
    - yay -S --noconfirm google-chrome
    - yay -S --noconfirm microsoft-edge-dev-bin
    - yay -S --noconfirm proton-pass-bin
    - yay -S --noconfirm visual-studio-code-bin
    - yay -S --noconfirm insync

Backup:
    - echo "Backing up files for modification during Omarchy setup."
    - sudo cp /etc/fstab /etc/fstab.bak.$(date '+%m-%d-%Y-%H_%M_%S')
    - sudo cp /etc/pam.d/sudo /etc/pam.d/sudo.bak.$(date '+%m-%d-%Y-%H_%M_%S')

VimSetup:
    - echo "No Vim Setup"
    
Environment:
    - echo "Environment setup for Omarchy Linux"
    - cd /home/${USER}/code && test -d bash_scripts || git clone https://github.com/linuxg33k76/bash_scripts.git
    - omarchy plugin add https://github.com/HoneySpoons/omarchy-localsend.git --enable
    - omarchy plugin add https://github.com/rmacy/omarchy-system-monitor.git --enable
    - omarchy plugin add https://github.com/r-witz/omarchy-nothing-ear.git --enable
    - omarchy plugin add https://github.com/ronald2wing/Omarchy-Bible --enable
    - omarchy plugin add https://github.com/linuxg33k76/omanetmonitor.git --enable
    - omarchy plugin add https://github.com/linuxg33k76/hey-im-gaming-here.git --enable
    - omarchy plugin add https://github.com/fross100/omaplug.git --enable
    - omarchy plugin add https://github.com/ejuro/blow-off-some-steam.git --enable
   